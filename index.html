<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Informatics Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Informatics Portal</h2>
            <p>UIN SAIZU - Library & Projects Archive</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Role</label>
                    <select id="userRole">
                        <option value="mahasiswa">Mahasiswa (Student)</option>
                        <option value="dosen">Dosen (Lecturer)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>NIM / Email</label>
                    <input type="text" id="username" placeholder="e.g. 264110601211" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-green">Sign In</button>
                <p style="margin-top: 1rem;">
    Don't have an account? <a href="register.html" style="color: var(--primary-green); font-weight: 600;">Register</a>
</p>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
