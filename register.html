<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Informatics Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Create Account</h2>
            <p>Register a new student or lecturer account</p>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Full name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="student@example.com" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="regRole">
                        <option value="student">Student</option>
                        <option value="lecturer">Lecturer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create password" required>
                </div>
                <button type="submit" class="btn-green">Register</button>
            </form>
            <p style="margin-top: 1rem;">
                Already have an account? <a href="index.html" style="color: var(--primary-green); font-weight: 600;">Sign In</a>
            </p>
        </div>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
